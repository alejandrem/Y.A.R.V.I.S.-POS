[package]
name = "src-ia"
license = "GPL-3.0-or-later"
# Los tests de integración se declaran explícitos abajo: los módulos hermanos
# de `estres` (soporte/fuzzing/masivo) NO deben autodescubrirse como targets.
autotests = false
version = "0.1.0"
edition = "2021"
description = "Núcleo de IA en Rust (migración desde yarvis-IA). Port de parseador, RAG, profeta y chat."

# El código vive en `parseador_de_tickets/` (espejo del paquete Python que
# reemplaza). El crate se importa como `src_ia::...` igual que antes.
[lib]
path = "parseador_de_tickets/lib.rs"

[features]
# Inferencia local con llama.cpp (Qwen GGUF) vía crate llama-cpp-4.
# Off por defecto para que el núcleo compile rápido en CI; el backend
# Tauri lo activa bajo `features = ["llm-local"]`.
llm-local = ["dep:llama-cpp-4"]

[dependencies]
calamine = "0.26"
chrono = "0.4"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
llama-cpp-4 = { version = "0.5", optional = true, features = ["native"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time", "sync", "macros"] }
# Logging estructurado (las macros son no-op sin subscriber)
tracing = "0.1"

[profile.dev]
opt-level = 1

[[test]]
name = "estres"
path = "tests/estres.rs"

[[test]]
name = "test_chat_1_7_real"
path = "tests/test_chat_1_7_real.rs"

[[test]]
name = "verificar_conexion"
path = "tests/verificar_conexion.rs"

[[test]]
name = "verificar_modelos"
path = "tests/verificar_modelos.rs"
