[package]
name = "yarvis-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "yarvis_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls"] }
tokio = { version = "1.38", features = ["full"] }
tauri-plugin-dialog = "2"
# Stream utilities para leer SSE chunk-by-chunk
futures-util = "0.3"
# Hashing seguro de contraseñas (Primera Ola - Seguridad)
argon2 = "0.5"
rand = "0.8"
# Serialización JSON (respuestas y payloads de comandos)
serde_json = "1"
# SHA256 para hashing de catálogos
sha2 = "0.10"
# Fechas y tiempo para módulo Finanzas
chrono = { version = "0.4", features = ["serde"] }
# Google OAuth (login con Google, PKCE + loopback)
base64 = "0.22"
url = "2"
reqwest = { version = "0.12", features = ["json"] }
# Núcleo de IA migrado a Rust (strangler fig): parseador, catálogos y vinculador
src-ia = { path = "../../src-ia", features = ["llm-local"] }
